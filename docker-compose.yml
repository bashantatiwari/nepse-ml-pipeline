x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/airflow/dags
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-metadata:3306/airflow_db"
  AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: "nabil-mlops-secret"
  PYTHONPATH: "/opt/airflow"
  MARIADB_HOST: "mariadb-metadata"
  MARIADB_PORT: "3306"
  MARIADB_USER: "${MARIADB_USER}"
  MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
  MARIADB_DATABASE: "${MARIADB_DATABASE}"
  COLUMNSTORE_HOST: "mariadb-columnstore"
  COLUMNSTORE_PORT: "3306"
  COLUMNSTORE_USER: "${COLUMNSTORE_USER}"
  COLUMNSTORE_PASSWORD: "${COLUMNSTORE_PASSWORD}"
  COLUMNSTORE_DATABASE: "${COLUMNSTORE_DATABASE}"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MLFLOW_S3_IGNORE_TLS: "true"
  GIT_PYTHON_REFRESH: "quiet"

x-airflow-volumes: &airflow-volumes
  - .:/opt/airflow

services:
  # ---------------------------------------------------------------------------
  # MariaDB Metadata — standard MariaDB for Airflow + MLflow metadata
  # ---------------------------------------------------------------------------
  mariadb-metadata:
    image: mariadb:11.2
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    ports:
      - "3307:3306"
    volumes:
      - mariadb_metadata_data:/var/lib/mysql
      - ./docker/mariadb-metadata-init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MariaDB ColumnStore — analytical warehouse for pipeline tables
  # ---------------------------------------------------------------------------
  mariadb-columnstore:
    image: mariadb/columnstore:latest
    entrypoint: ["/docker-entrypoint-initdb.d/docker-entrypoint-columnstore.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: "${COLUMNSTORE_PASSWORD}"
      MARIADB_USER: "${COLUMNSTORE_USER}"
      MARIADB_PASSWORD: "${COLUMNSTORE_PASSWORD}"
      MARIADB_DATABASE: "${COLUMNSTORE_DATABASE}"
    ports:
      - "3306:3306"
    volumes:
      - columnstore_data:/var/lib/mysql
      - columnstore_cs_data:/var/lib/columnstore
      - ./docker/columnstore-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${COLUMNSTORE_PASSWORD}", "-e", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MLflow — backed by metadata MariaDB
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri "mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-metadata:3306/${MARIADB_DATABASE}"
      --default-artifact-root /mlflow/mlruns
    ports:
      - "5000:5000"
    environment:
      MARIADB_HOST: "mariadb-metadata"
      MARIADB_PORT: "3306"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      MLFLOW_ALLOW_SERVING_UNSAFE_HOSTNAME: "true"
    volumes:
      - .:/app
      - mlflow_artifacts:/mlflow/mlruns
    depends_on:
      mariadb-metadata:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FastAPI
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.serving.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MARIADB_HOST: "mariadb-metadata"
      MARIADB_PORT: "3306"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      COLUMNSTORE_HOST: "mariadb-columnstore"
      COLUMNSTORE_PORT: "3306"
      COLUMNSTORE_USER: "${COLUMNSTORE_USER}"
      COLUMNSTORE_PASSWORD: "${COLUMNSTORE_PASSWORD}"
      COLUMNSTORE_DATABASE: "${COLUMNSTORE_DATABASE}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - .:/app
    depends_on:
      mariadb-metadata:
        condition: service_healthy
      mariadb-columnstore:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow init
  # ---------------------------------------------------------------------------
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID}:0"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "airflow"
      _AIRFLOW_WWW_USER_PASSWORD: "airflow"
    volumes: *airflow-volumes
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    depends_on:
      mariadb-metadata:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow webserver
  # ---------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID}:0"
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Airflow scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID}:0"
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  mariadb_metadata_data:
  columnstore_cs_data:
  columnstore_data:
  mlflow_artifacts:
