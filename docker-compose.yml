version: '3.8'

# ---------------------------------------------------------------------------
# Shared environment block for all Airflow services.
# All three Airflow containers (init, webserver, scheduler) reference this
# using the YAML merge key (<<: *airflow-env). Only plain scalars are merged
# — no nested key dot-notation, which is invalid in YAML.
# ---------------------------------------------------------------------------
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-columnstore:3306/airflow_db"
  AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqDDho="
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__WEBSERVER__SECRET_KEY: "nabil-mlops-secret"
  # Inject pipeline dependencies into the Airflow container at runtime
  _PIP_ADDITIONAL_REQUIREMENTS: "pandas scikit-learn joblib mariadb pymysql redis mlflow evidently>=0.4.0,<0.5.0 python-dotenv requests"  
  PYTHONPATH: "/opt/airflow"
  MARIADB_HOST: "mariadb-columnstore"
  MARIADB_PORT: "3306"
  MARIADB_USER: "${MARIADB_USER}"
  MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
  MARIADB_DATABASE: "${MARIADB_DATABASE}"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  MLFLOW_TRACKING_URI: "http://mlflow:5000"

x-airflow-volumes: &airflow-volumes
  - .:/opt/airflow

services:

  # ---------------------------------------------------------------------------
  # MariaDB (serves as both the pipeline data store and Airflow metadata DB)
  # Service name kept as mariadb-columnstore per project requirements.
  # Standard MariaDB 11 is used for coursework stability; ColumnStore is noted
  # in README as the intended production target.
  # ---------------------------------------------------------------------------
  mariadb-columnstore:
    image: mariadb:11.2
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # Init scripts run on first startup — creates airflow_db and grants access
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  redis:
  # ---------------------------------------------------------------------------
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # MLflow tracking server — backed by MariaDB
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri "mysql+pymysql://${MARIADB_USER}:${MARIADB_PASSWORD}@mariadb-columnstore:3306/${MARIADB_DATABASE}"
      --default-artifact-root /app/mlruns
    ports:
      - "5000:5000"
    environment:
      MARIADB_HOST: "mariadb-columnstore"
      MARIADB_PORT: "3306"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
    volumes:
      - .:/app
    depends_on:
      mariadb-columnstore:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FastAPI prediction server
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.serving.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MARIADB_HOST: "mariadb-columnstore"
      MARIADB_PORT: "3306"
      MARIADB_USER: "${MARIADB_USER}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD}"
      MARIADB_DATABASE: "${MARIADB_DATABASE}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - .:/app
    depends_on:
      mariadb-columnstore:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow — one-time initialisation job (runs db migrate + creates admin user)
  # ---------------------------------------------------------------------------
  airflow-init:
    image: apache/airflow:2.9.1
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "airflow"
      _AIRFLOW_WWW_USER_PASSWORD: "airflow"
    volumes: *airflow-volumes
    # Run db migrate (Airflow 2.7+) then create the admin web user.
    # Falls back gracefully: 'db migrate' is preferred over deprecated 'db init'.
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username airflow
          --password airflow
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
      "
    depends_on:
      mariadb-columnstore:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Airflow webserver
  # ---------------------------------------------------------------------------
  airflow-webserver:
    image: apache/airflow:2.9.1
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Airflow scheduler
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    image: apache/airflow:2.9.1
    environment:
      <<: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  mariadb_data:
